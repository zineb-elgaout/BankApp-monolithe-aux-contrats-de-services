openapi: 3.0.3

# Contrat du service Notification de BankApp.
# Aucun code n'existe encore : ce contrat est écrit d'abord (approche « contrat d'abord »).
info:
  title: Service Notification
  version: 1.0.0
  description: >
    Prévient un client par SMS, e-mail ou notification mobile, pour tous les processus de la banque.
    Chaque envoi est historisé dans la table T_ENVOI de la base NOTIF_DB.
  x-fiche:
    famille: utilitaire
    role: prévenir un client sur le canal choisi
    proprietaire: équipe Canaux
    consommateurs: [Prêts, Comptes, CRM, Mobile]
    qualite: prise en charge en moins de 1 seconde

paths:
  /notification/notifier:
    post:
      operationId: notifier
      summary: Demander l'envoi d'un message à un client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeNotification'
      responses:
        '202':
          description: L'envoi est pris en charge. Il sera effectué plus tard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiviEnvoi'
              example:
                idNotification: N-000123
                statut: EN_ATTENTE
        '404':
          description: Le client n'est pas connu de la banque.
          content:
            application/json:
              schema:
                type: object
                properties:
                  erreur:
                    type: string
              example:
                erreur: client inconnu

  /notification/suivreEnvoi:
    post:
      operationId: suivreEnvoi
      summary: Connaître l'état d'un envoi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeSuivi'
      responses:
        '200':
          description: L'état de l'envoi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiviEnvoi'
              example:
                idNotification: N-000123
                statut: ENVOYE

components:
  schemas:

    DemandeNotification:
      type: object
      required: [idClient, message, canal]
      properties:
        idClient:
          type: string
          pattern: '^C-[0-9]{4}$'
        message:
          type: string
          minLength: 1
          maxLength: 160
        canal:
          type: string
          enum: [SMS, EMAIL, PUSH]

    DemandeSuivi:
      type: object
      required: [idNotification]
      properties:
        idNotification:
          type: string
          pattern: '^N-[0-9]{6}$'

    SuiviEnvoi:
      type: object
      required: [idNotification, statut]
      properties:
        idNotification:
          type: string
          pattern: '^N-[0-9]{6}$'
        statut:
          type: string
          enum: [EN_ATTENTE, ENVOYE, ECHEC]
